name: Feature request
description: Something dspec should do and does not
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        dspec does one thing: it keeps a map of your codebase so your agent can answer questions
        without searching. A request that makes the map better, cheaper or truer has a good chance.

        A request that adds a **process** — a spec to write, a plan to approve, a gate to pass, a
        required order of work — does not. Version 0.2.0 deliberately removed all of that. Some
        other things are ruled out on purpose too; the non-negotiables are in
        [CONTRIBUTING.md](https://github.com/tuna781/dspec/blob/master/CONTRIBUTING.md).

  - type: textarea
    id: problem
    attributes:
      label: What were you trying to do?
      description: The situation you were in, not the feature you have in mind. The problem survives longer than the solution.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: What happens today
      description: What dspec does now, and why that is not enough.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like it to do
    validations:
      required: false

  - type: checkboxes
    id: rules
    attributes:
      label: Does it hold to the rules?
      options:
        - label: It needs no runtime dependency
        - label: It needs no network call, server or token
        - label: It does not require anyone to work in a particular way
        - label: It can be done the same way for Claude Code, Codex and Cursor
