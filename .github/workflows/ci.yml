name: CI

# ⚠️ `master`, not `main`. This said `main` — a branch that has never existed here — so the
# push trigger never fired once and CI was green by never running.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    name: Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  install:
    runs-on: ubuntu-latest
    name: Install surface
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      # ⚠️ What `npm pack` includes is what a user actually receives. `templates/` missing from the
      # tarball would install a `dspec` whose every command reports an incomplete install — and
      # nothing else in the suite would catch it, because the checkout always has the directory.
      #
      # ⚠️ A BLOCK scalar, not a plain one. Written inline, the `": "` inside the grep pattern is a
      # YAML mapping separator, so the whole file failed to parse — GitHub created no job at all and
      # every push since reported a 0-second failure that looked like CI rather than YAML.
      - run: |
          npm pack --dry-run --json > /tmp/pack.json
          grep -q '"path": "templates/bootstrap.md"' /tmp/pack.json
          grep -q '"path": "templates/memory.md"' /tmp/pack.json
      # ⚠️ The install is exercised against a real empty repository, because every bug this tool
      # can have is a bug about where a file lands. `CODEX_HOME` is redirected so the job never
      # writes into the runner's own home.
      - name: Install into a scratch repository
        run: |
          BIN="$PWD/bin/ds.js"
          R=$(mktemp -d)
          git -C "$R" init -q
          cd "$R"
          CODEX_HOME="$R/codex" node "$BIN" init --all
          test -f .claude/commands/ds-bootstrap.md
          test -f .agents/skills/ds-bootstrap/SKILL.md
          test -f "$R/codex/prompts/ds-bootstrap.md"
          test -f CLAUDE.md && test -f AGENTS.md
          # `init` installs; it must never invent a map of somebody's codebase as a side effect.
          test ! -e .ds
